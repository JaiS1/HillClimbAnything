<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" width="960" height="388" role="img" aria-label="Terminal: hca quick measures the noise, hca try keeps a -28.6% change and reverts one a single run had read as -17.9%, and hca confirm passes at -53.8% on held-out documents.">
