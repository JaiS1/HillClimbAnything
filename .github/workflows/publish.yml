name: publish

# Trusted publishing: no API tokens are stored anywhere. PyPI trusts this workflow file in this
# repository, in the named environment. Setup steps are in docs/RELEASING.md.
on:
  release:
    types: [published]          # a published GitHub release publishes to PyPI
  workflow_dispatch:            # a manual run publishes to TestPyPI (a rehearsal)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet build twine
          python -m build
          python -m twine check dist/*
          python -m zipfile -l dist/*.whl | grep -q "hca/skill/SKILL.md"
      - name: Version matches the release tag
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "pyproject version v$version != tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
