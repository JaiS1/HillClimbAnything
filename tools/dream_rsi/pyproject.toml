[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-loop"
version = "0.1.0"
description = "Dream-RSI-inspired research harness for mathematical, scientific and engineering search"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dream-loop = "dream_rsi.cli:main"

[tool.setuptools]
packages = ["dream_rsi"]
package-dir = {dream_rsi = "."}

[tool.setuptools.package-data]
dream_rsi = ["POLICY_DEVELOPER.md", "REFERENCES.md", "DESIGN_NOTES.md", "examples/*.py", "examples/knapsack/*.py", "examples/knapsack/*.json", "examples/knapsack/seed/*.json"]
